# Andor Health System - Provider-Focused Configuration
# Version: 1.0
# Date: November 8, 2025
# Purpose: Configure pre-crawl discovery for Andor Health System (Provider/Clinical focus)

project:
  name: "Andor Health System"
  type: "provider"
  focus: "Provider-focused clinical and quality data"
  description: "EHR integration with Epic for clinical data exchange and quality reporting"

# Required resources (must have)
required_resources:
  # Core clinical resources
  - Patient
  - Practitioner
  - PractitionerRole
  - Organization
  - Location
  - Encounter
  - EpisodeOfCare

  # Clinical data
  - Observation
  - Condition
  - Procedure
  - DiagnosticReport
  - DocumentReference

  # Medications
  - Medication
  - MedicationRequest
  - MedicationDispense
  - MedicationAdministration
  - MedicationStatement

  # Quality measurement
  - Measure
  - MeasureReport
  - Library
  - GuidanceResponse

  # Care coordination
  - CarePlan
  - CareTeam
  - Goal
  - ReferralRequest

# Preferred resources (nice to have)
preferred_resources:
  - AllergyIntolerance
  - Immunization
  - FamilyMemberHistory
  - RiskAssessment
  - Appointment
  - Schedule
  - Slot
  - PlanDefinition
  - ActivityDefinition
  - RequestGroup

# Implementation Guides
implementation_guides:
  - name: "US Core"
    url: "http://hl7.org/fhir/us/core/STU6.1/"
    url_pattern: "*/us/core/*"
    version: "6.1.0"
    priority: "high"

  - name: "QI-Core"
    url: "http://hl7.org/fhir/us/qicore/STU6/"
    url_pattern: "*/qicore/*"
    version: "6.0.0"
    priority: "high"

  - name: "Da Vinci DEQM"
    url: "https://build.fhir.org/ig/HL7/davinci-deqm/STU3/"
    url_pattern: "*davinci-deqm*"
    version: "3.1.0"
    priority: "medium"

  - name: "Da Vinci ATR"
    url: "http://hl7.org/fhir/us/davinci-atr/STU1/"
    url_pattern: "*davinci-atr*"
    version: "1.0.0"
    priority: "medium"

  - name: "Bulk FHIR"
    url: "https://hl7.org/fhir/uv/bulkdata/STU2/"
    url_pattern: "*bulkdata*"
    version: "2.0.0"
    priority: "high"

# BM25 Scoring Queries
bm25_queries:
  # Primary clinical focus
  - "patient practitioner organization encounter observation diagnostic report"
  - "condition procedure medication request administration clinical data"

  # Quality measurement
  - "quality measure reporting measurereport library qicore clinical quality"
  - "performance measurement improvement outcomes metrics"

  # US Core specific
  - "US Core implementation guide profile extension search parameter"
  - "US Core patient practitioner organization vital signs laboratory"

  # Bulk operations
  - "bulk data export operation async pattern group export ndjson"
  - "$export operation bulk fhir batch transaction"

  # Care coordination
  - "care plan care team coordination referral episode clinical pathway"
  - "goal activity definition plan workflow"

  # Epic integration specific
  - "epic integration ehr interoperability fhir server"

# URL Filtering Patterns
filter_patterns:
  include:
    # Core R4 resources
    - "*/fhir/R4/*"
    - "*/fhir/r4/*"

    # US Core
    - "*/us/core/*"
    - "*us-core-*"

    # QI-Core
    - "*/qicore/*"
    - "*qi-core*"

    # Da Vinci IGs
    - "*davinci-deqm*"
    - "*davinci-atr*"

    # Bulk FHIR
    - "*bulkdata*"
    - "*bulk-data*"

    # Operations
    - "*/operation*"
    - "*/$export*"

  exclude:
    # Version exclusions
    - "*/fhir/R5/*"
    - "*/fhir/R4B/*"
    - "*/fhir/R3/*"
    - "*-ballot*"
    - "*-snapshot*"

    # Financial (not primary focus)
    - "*/claim*.html"
    - "*/coverage*.html"
    - "*/explanationofbenefit*.html"

    # Low-value content
    - "*-questionnaire.html"
    - "*-spreadsheet.xml"
    - "*.xsd"
    - "*.sch"
    - "*.zip"

    # Examples (unless high score)
    - "*/examples/*"  # Will include if score > 0.8

# Scoring Configuration
scoring:
  score_threshold: 0.3  # Minimum score to include

  category_weights:
    resource: 1.0        # Highest priority
    module: 0.9          # High priority
    implementation: 0.95 # Very high priority
    valueset: 0.7        # Medium priority
    codesystem: 0.7      # Medium priority
    operation: 0.85      # High priority
    example: 0.4         # Low priority
    profile: 0.9         # High priority
    extension: 0.8       # Medium-high priority
    searchparameter: 0.75 # Medium priority

# Depth Strategy
depth_strategy:
  resource: 0           # Just the definition
  module: 1             # Module + immediate children
  implementation: 1     # IG main page + profiles
  valueset: 1           # ValueSet + codes
  codesystem: 1         # CodeSystem + codes
  operation: 0          # Just the operation definition
  example: 2            # Example + referenced resources
  profile: 1            # Profile + constraints
  extension: 0          # Just the extension definition
  searchparameter: 0    # Just the search parameter

# URL Limits
max_urls:
  total: 600            # Target range: 400-600

  per_category:
    resource: 220       # All clinical resources
    module: 50          # Key modules
    implementation: 120 # US Core, QI-Core, etc.
    valueset: 100       # Essential value sets
    codesystem: 50      # Key code systems
    operation: 30       # Bulk export, etc.
    example: 40         # Selective examples
    profile: 100        # US Core profiles
    extension: 50       # US Core extensions
    searchparameter: 40 # Search parameters

# Performance Settings
performance:
  max_concurrent: 20    # Concurrent HEAD requests
  batch_size: 100       # URLs per batch
  timeout: 10           # Seconds per request
  retry_count: 2        # Retries on failure
  cache_ttl: 604800     # 7 days cache
  rate_limit: 10        # Requests per second

# Output Settings
output:
  format: "csv"         # csv or json
  include_metadata: true
  include_scores: true
  sort_by: "score"      # score, category, or url

# Validation Settings
validation:
  require_all_essential: true
  min_ig_coverage: 0.8  # 80% of IG resources
  check_r4_only: true
  exclude_draft: true